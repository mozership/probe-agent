name: Test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # The tests of the page package build probe-browser and drive a real
  # Chrome through it; the others answer from a stand-in for the model.
  test:
    # Labelling a pull request asks for the e2e jobs alone.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # The server of the e2e workflow is a module of its own, which the
      # commands above do not reach.
      - run: go -C e2e/server vet ./...
      - run: go -C e2e/server test ./...

  # The action run through Probe against the sign-up of e2e/server, with a
  # real model, which it calls with the OIDC token of the job.
  e2e:
    runs-on: ubuntu-latest
    # The model is paid for each run, so the job runs only when asked: by
    # the label e2e-with-api on a pull request, which only those who can
    # write to the repository can put, or by a run started by hand. A pull
    # request from a fork gets no OIDC token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e-with-api' &&
      !github.event.pull_request.head.repo.fork)
    permissions:
      contents: read
      id-token: write
      # probe-github-notes puts the notes of the agent in a comment on the
      # pull request.
      pull-requests: write
    # Two runs on the same pull request at once could each add a comment of
    # the notes, rather than edit the one there.
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The Claude API is called with the OIDC token of the job, through
      # workload identity federation, rather than an API key: probe-agent
      # asks GitHub for a new token for each exchange.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01LLJkzfYqamUwaAeerrnZMb
      ANTHROPIC_ORGANIZATION_ID: 58f3ed17-7b9b-46e4-b827-dac67024964c
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01TXGJqXGordksx5PMkWCSeN
      ANTHROPIC_WORKSPACE_ID: wrkspc_01FWywmW8kRVkfcsLzAsry6X
      # CI replays the recording committed, writes none, and fails when it
      # no longer matches rather than paying the tester to carry on.
      CACHE_MODE: strict
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Probe resolves the action before the first job of a workflow, so it
      # is built first.
      - run: go build -o e2e/action/probe-agent .
      - name: Start the sign-up server
        run: |
          go -C e2e/server build -o server .
          e2e/server/server > "$RUNNER_TEMP/server.txt" 2>&1 &
      # The agent calls probe-browser with ActionCaller, which needs probe
      # v1.37.0 or later, and lists the services of a gRPC API with the grpc
      # action, which needs v1.38.0 or later.
      - name: Run the e2e workflow
        uses: mozership/probe-action@5bf9b862f45a719fbc97b240c82b74e73ff5f2de # v1.4.0
        with:
          path: e2e/workflow.yml
          version: v1.38.0
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-evidence
          path: |
            out/agent
            out/cache
      - name: What the server logged
        if: always()
        run: cat "$RUNNER_TEMP/server.txt"

  # The action driving the Settings app of an iOS simulator through
  # probe-ios, alone and beside a browser, with a real model. It needs
  # macOS for Xcode and the simulator, and the OIDC token of the job for
  # the Claude API.
  e2e-ios:
    runs-on: macos-26
    # The model is paid for each run, so the job runs only when asked: by
    # the label e2e-with-api on a pull request, which only those who can
    # write to the repository can put, or by a run started by hand. A pull
    # request from a fork gets no OIDC token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e-with-api' &&
      !github.event.pull_request.head.repo.fork)
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      # probe-github-notes puts the notes of the agent in a comment on the
      # pull request.
      pull-requests: write
    # Two runs on the same pull request at once could each add a comment of
    # the notes, rather than edit the one there.
    concurrency:
      group: e2e-ios-${{ github.event.pull_request.number || github.ref }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The Claude API is called with the OIDC token of the job, through
      # workload identity federation, rather than an API key: probe-agent
      # asks GitHub for a new token for each exchange.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01LLJkzfYqamUwaAeerrnZMb
      ANTHROPIC_ORGANIZATION_ID: 58f3ed17-7b9b-46e4-b827-dac67024964c
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01TXGJqXGordksx5PMkWCSeN
      ANTHROPIC_WORKSPACE_ID: wrkspc_01FWywmW8kRVkfcsLzAsry6X
      PROBE_IOS_CACHE_DIR: ${{ github.workspace }}/.probe-ios
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # probe-ios builds its runner the first time, which takes minutes;
      # its own key changes with Xcode, so a stale entry is only built over.
      - uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .probe-ios/runner
          key: probe-ios-runner-${{ runner.os }}-${{ hashFiles('e2e/ios.yml') }}
      # As in the e2e tests of probe-ios: a simulator on a named runtime,
      # booted by its UDID, and left to settle before XCUITest queries it.
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl create e2e "iPhone 17" com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          xcrun simctl bootstatus "$UDID" -b
          echo "DEVICE=$UDID" >> "$GITHUB_ENV"
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 60
          xcrun simctl terminate "$UDID" com.apple.Preferences
      - run: go build -o e2e/action/probe-agent .
      - name: Start the server
        run: |
          go -C e2e/server build -o server .
          e2e/server/server > "$RUNNER_TEMP/server.txt" 2>&1 &
      # The agent calls probe-ios with ActionCaller, which needs probe
      # v1.37.0 or later; probe-action installs it on macOS from v1.4.0.
      - name: Run the iOS e2e workflow
        uses: mozership/probe-action@5bf9b862f45a719fbc97b240c82b74e73ff5f2de # v1.4.0
        with:
          path: e2e/ios.yml
          version: v1.37.0
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-ios-evidence
          path: |
            out/agent
            out/cache

  # The action driving the Settings app of an Android emulator through
  # probe-android, alone and beside a browser, with a real model. The
  # emulator runs at speed only with KVM, which an Ubuntu runner has but
  # does not open to the job's user.
  e2e-android:
    runs-on: ubuntu-latest
    # The model is paid for each run, so the job runs only when asked: by
    # the label e2e-with-api on a pull request, which only those who can
    # write to the repository can put, or by a run started by hand. A pull
    # request from a fork gets no OIDC token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e-with-api' &&
      !github.event.pull_request.head.repo.fork)
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      # probe-github-notes puts the notes of the agent in a comment on the
      # pull request.
      pull-requests: write
    # Two runs on the same pull request at once could each add a comment of
    # the notes, rather than edit the one there.
    concurrency:
      group: e2e-android-${{ github.event.pull_request.number || github.ref }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # The Claude API is called with the OIDC token of the job, through
      # workload identity federation, rather than an API key: probe-agent
      # asks GitHub for a new token for each exchange.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01LLJkzfYqamUwaAeerrnZMb
      ANTHROPIC_ORGANIZATION_ID: 58f3ed17-7b9b-46e4-b827-dac67024964c
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01TXGJqXGordksx5PMkWCSeN
      ANTHROPIC_WORKSPACE_ID: wrkspc_01FWywmW8kRVkfcsLzAsry6X
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o e2e/action/probe-agent .
      - name: Start the server
        run: |
          go -C e2e/server build -o server .
          e2e/server/server > "$RUNNER_TEMP/server.txt" 2>&1 &
      # probe-action adds probe to PATH for the emulator's script. The agent
      # calls probe-android with ActionCaller, which needs probe v1.37.0 or
      # later.
      - name: Install Probe
        uses: mozership/probe-action@5bf9b862f45a719fbc97b240c82b74e73ff5f2de # v1.4.0
        with:
          install-only: true
          version: v1.38.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # As in the e2e tests of probe-android: an emulator of API 35, whose
      # animations the runner turns off, as uiautomator cannot read a screen
      # that is still moving.
      - name: Run the Android e2e workflow on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: probe e2e/android.yml
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-android-evidence
          path: |
            out/agent
            out/cache
      - name: What the server logged
        if: always()
        run: cat "$RUNNER_TEMP/server.txt"

  # The label asks for one run of the e2e jobs. Taking it off once they are
  # over lets it be put back for another, after a new push.
  unlabel:
    needs: [e2e, e2e-ios, e2e-android]
    if: always() && github.event.action == 'labeled' && github.event.label.name == 'e2e-with-api'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label e2e-with-api
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}

  lint:
    # Labelling a pull request asks for the e2e jobs alone.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # go fix rewrites code to what the Go version in go.mod has, such as
      # maps.Copy for a loop that copies a map. -diff prints the rewrites
      # instead of applying them, and fails when there is any: run go fix ./...
      # and commit what it changes.
      - name: go fix
        run: go fix -diff ./...

  # govulncheck fails on a vulnerability the code calls, in a module it
  # requires or in the standard library of the Go in go.mod, which releases
  # are built with: update the module, or the Go in go.mod.
  vuln:
    # Labelling a pull request asks for the e2e jobs alone.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
