# The end-to-end tests: probe-agent run through Probe against the sign-up of
# e2e/server, with a real Chrome and a real model. Run it from the
# repository root, with the server listening, Chrome installed and
# ANTHROPIC_API_KEY set, and the action built first, as Probe resolves it
# before the first job:
#
#   go -C e2e/server run . &
#   go build -o e2e/action/probe-agent . && probe e2e/workflow.yml
#
# Each run signs up with addresses of its own, so that runs against the same
# server do not collide.
#
# The sign-up of Alice replays e2e/cache/signup.json, and records it again
# when it no longer matches. CI runs with CACHE_MODE=strict, which writes no
# recording and blocks the test when the one committed no longer matches,
# and checks that it is replayed whole.
#
# The job Signed in signs Dave up with probe-browser, saves the login with
# its save_storage_state, and has the tester change the name on the account
# page, which sends anyone signed out to the sign-up, starting from that
# state rather than signing in.
#
# PROVIDER and MODEL run the tests with another model, as
# PROVIDER=openai MODEL=gpt-5.4 with OPENAI_API_KEY set. The recording
# would be replayed whatever the model, so give CACHE_MODE=refresh for the
# tester to sign Alice up, and leave the recording it writes uncommitted.
name: probe-agent against a sign-up

actions:
  agent: ./action
  browser: github.com/mozership/probe-browser@5e0ee79cb660e5c855414935f51ad3eeb7c6ad6e # v0.6.1

secrets:
- ANTHROPIC_API_KEY
- OPENAI_API_KEY
- XAI_API_KEY
- GEMINI_API_KEY
- SAKURA_AI_ENGINE_TOKEN

vars:
  url: "{{APP_URL ?? 'http://localhost:18090'}}"
  id: "{{random_str(8)}}"
  password: "pw-{{random_str(16)}}"
  cache_mode: "{{CACHE_MODE ?? 'auto'}}"
  provider: "{{PROVIDER ?? 'anthropic'}}"
  model: "{{MODEL ?? ''}}"

jobs:
- name: Sign-up
  defaults:
    agent:
      url: "{{vars.url}}/"
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: A new user signs up with an email and a password
    id: signup
    uses: agent
    with:
      task: |
        As a new user of this service, sign up for an account with the name
        Alice Tester, the email address {secret:EMAIL} and the password
        {secret:PASSWORD}, agreeing to the terms.
      expect: |
        The account is created: a page welcomes Alice Tester by name and says
        the account for the email address is ready.
      secrets:
        EMAIL: "alice+{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
      cache: e2e/cache/signup.json
      cache_mode: "{{vars.cache_mode}}"
    timeout: 5m
    test: res.verdict == "pass" && (vars.cache_mode != "strict" || res.cache.status == "hit")
    outputs:
      report: res.filepaths.report
  - name: The account exists, as the pages said
    uses: http
    with:
      url: "{{vars.url}}"
      get: "/api/users?email=alice%2B{{vars.id}}%40example.com"
    test: res.code == 200 && res.body.exists == true && res.body.name == "Alice Tester"
  - name: A sign-up the server fails is judged to fail
    uses: agent
    with:
      task: |
        As a new user of this service, sign up for an account with the name
        Bob Tester, the email address {secret:EMAIL} and the password
        {secret:PASSWORD}, agreeing to the terms.
      expect: |
        The account is created: a page welcomes Bob Tester by name.
      secrets:
        EMAIL: "bob+broken-{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
    timeout: 5m
    test: res.verdict == "fail" && len(filter(res.network_errors, .status == 500)) > 0

- name: Persona
  defaults:
    agent:
      url: "{{vars.url}}/"
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: A first-time visitor finds that the first note cannot be written
    uses: agent
    with:
      persona: |
        Carol, who has never used a notes app before and is not technical.
        She signs up with the email address {secret:EMAIL} and the password
        {secret:PASSWORD}.
      goal: |
        Create an account, and write a first note that says "Buy milk".
      secrets:
        EMAIL: "carol+{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
    timeout: 5m
    test: |
      res.mode == "persona" && res.verdict == "fail"
      && len(filter(res.findings, .severity == "high" && .verified)) > 0
      && len(filter(res.network_errors, .status == 500)) > 0

- name: Signed in
  defaults:
    agent:
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: Dave signs up in the browser, and the login is saved
    id: login
    uses: browser
    with:
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/signup"
      - name: type
        selector: "#name"
        value: Dave Tester
      - name: type
        selector: "#email"
        value: "dave+{{vars.id}}@example.com"
      - name: type
        selector: "#password"
        value: "{{vars.password}}"
      - name: type
        selector: "#confirm"
        value: "{{vars.password}}"
      - name: click
        selector: "input[name='terms']"
      - name: click
        selector: "button[type='submit']"
      - name: wait_text
        selector: h1
        equals: "Welcome to Acme Notes, Dave Tester!"
      - name: save_storage_state
        id: state
    test: res.code == 0 && res.filepaths.state endsWith ".json"
    outputs:
      state: res.filepaths.state
  # Signed out, the account page sends to the sign-up, and the tester has
  # no password to sign in with: only the saved login gets it there.
  - name: A signed-in user changes their name, starting from the saved login
    uses: agent
    with:
      url: "{{vars.url}}/account"
      storage_state: "{{outputs.login.state}}"
      task: |
        On your account page, change your display name to Dave Renamed, and
        save it.
      expect: |
        The page says the name is saved, and shows the account signed in as
        Dave Renamed.
    timeout: 5m
    test: |
      res.verdict == "pass" && res.url endsWith "/account"
      && len(filter(res.steps, .url contains "/signup")) == 0
  - name: The name changed, as the pages said
    uses: http
    with:
      url: "{{vars.url}}"
      get: "/api/users?email=dave%2B{{vars.id}}%40example.com"
    test: res.code == 200 && res.body.exists == true && res.body.name == "Dave Renamed"
