# The end-to-end tests: probe-agent run through Probe against the sign-up of
# e2e/server, with a real Chrome, driven through probe-browser, and a real
# model. Run it from the repository root, with the server listening, Chrome
# installed and ANTHROPIC_API_KEY set, and the action built first, as Probe
# resolves it before the first job:
#
#   go -C e2e/server run . &
#   go build -o e2e/action/probe-agent . && probe e2e/workflow.yml
#
# Each run signs up with addresses of its own, so that runs against the same
# server do not collide.
#
# The sign-up of Alice replays e2e/cache/signup.json, and records it again
# when it no longer matches. CI runs with CACHE_MODE=strict, which writes no
# recording and blocks the test when the one committed no longer matches,
# and checks that it is replayed whole.
#
# The calls of probe-browser need Probe v1.37.0 or later.
#
# The job Signed in signs Dave up with probe-browser, saves the login with
# its save_storage_state, and has the tester change the name on the account
# page, which sends anyone signed out to the sign-up, starting from that
# state rather than signing in.
#
# The job API has the tester call the notes API of e2e/server through the
# http action of Probe, which the agent calls as a step of the run would,
# and the job gRPC its gRPC service through the grpc action, which needs
# Probe v1.38.0 or later.
#
# PROVIDER and MODEL run the tests with another model, as
# PROVIDER=openai MODEL=gpt-5.4 with OPENAI_API_KEY set. The recording
# would be replayed whatever the model, so give CACHE_MODE=refresh for the
# tester to sign Alice up, and leave the recording it writes uncommitted.
name: probe-agent against a sign-up

actions:
  agent: ./action
  browser: github.com/mozership/probe-browser@a9c1dca2ae8f0e79ebfbe4482d37a928237c2f4d # v0.11.1
  github-notes: github.com/mozership/probe-github-notes@d2df0b2dbbbffd3e368d156e571bf9bf2f784b76 # v0.1.3

secrets:
- ANTHROPIC_API_KEY
- OPENAI_API_KEY
- XAI_API_KEY
- GEMINI_API_KEY
- SAKURA_AI_ENGINE_TOKEN
- GITHUB_TOKEN

vars:
  url: "{{APP_URL ?? 'http://localhost:18090'}}"
  grpc_addr: "{{GRPC_ADDR ?? '127.0.0.1:18091'}}"
  id: "{{random_str(8)}}"
  password: "pw-{{random_str(16)}}"
  cache_mode: "{{CACHE_MODE ?? 'auto'}}"
  provider: "{{PROVIDER ?? 'anthropic'}}"
  model: "{{MODEL ?? ''}}"
  github_token: "{{GITHUB_TOKEN ?? ''}}"

jobs:
- name: Sign-up
  id: signup
  defaults:
    agent:
      targets:
        browser:
          url: "{{vars.url}}/"
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: A new user signs up with an email and a password
    id: signup
    uses: agent
    with:
      task: |
        As a new user of this service, sign up for an account with the name
        Alice Tester, the email address {secret:EMAIL} and the password
        {secret:PASSWORD}, agreeing to the terms.
      expect: |
        The account is created: a page welcomes Alice Tester by name and says
        the account for the email address is ready.
      secrets:
        EMAIL: "alice+{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
      cache: e2e/cache/signup.json
      cache_mode: "{{vars.cache_mode}}"
    timeout: 5m
    test: res.verdict == "pass" && (vars.cache_mode != "strict" || res.cache.status == "hit")
    outputs:
      report: res.filepaths.report
  - name: The account exists, as the pages said
    uses: http
    with:
      url: "{{vars.url}}"
      get: "/api/users?email=alice%2B{{vars.id}}%40example.com"
    test: res.code == 200 && res.body.exists == true && res.body.name == "Alice Tester"
  - name: A sign-up the server fails is judged to fail
    uses: agent
    with:
      task: |
        As a new user of this service, sign up for an account with the name
        Bob Tester, the email address {secret:EMAIL} and the password
        {secret:PASSWORD}, agreeing to the terms.
      expect: |
        The account is created: a page welcomes Bob Tester by name.
      secrets:
        EMAIL: "bob+broken-{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
    timeout: 5m
    test: |
      res.verdict == "fail" && len(filter(res.network_errors, .status == 500)) > 0
      && len(filter(res.notes, .level == "critical")) == 1

- name: Persona
  id: persona
  defaults:
    agent:
      targets:
        browser:
          url: "{{vars.url}}/"
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: A first-time visitor finds that the first note cannot be written
    uses: agent
    with:
      persona: |
        Carol, who has never used a notes app before and is not technical.
        She signs up with the email address {secret:EMAIL} and the password
        {secret:PASSWORD}.
      goal: |
        Create an account, and write a first note that says "Buy milk".
      secrets:
        EMAIL: "carol+{{vars.id}}@example.com"
        PASSWORD: "{{vars.password}}"
    timeout: 5m
    test: |
      res.mode == "persona" && res.verdict == "fail"
      && len(filter(res.findings, .severity == "high" && .verified)) > 0
      && len(filter(res.notes, .level == "critical")) > 0
      && len(filter(res.network_errors, .status == 500)) > 0

- name: Signed in
  id: signed-in
  defaults:
    agent:
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: Dave signs up in the browser, and the login is saved
    id: login
    uses: browser
    with:
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/signup"
      - name: type
        selector: "#name"
        value: Dave Tester
      - name: type
        selector: "#email"
        value: "dave+{{vars.id}}@example.com"
      - name: type
        selector: "#password"
        value: "{{vars.password}}"
      - name: type
        selector: "#confirm"
        value: "{{vars.password}}"
      - name: click
        selector: "input[name='terms']"
      - name: click
        selector: "button[type='submit']"
      - name: wait_text
        selector: h1
        equals: "Welcome to Acme Notes, Dave Tester!"
      - name: save_storage_state
        id: state
    test: res.code == 0 && res.filepaths.state endsWith ".json"
    outputs:
      state: res.filepaths.state
  # Signed out, the account page sends to the sign-up, and the tester has
  # no password to sign in with: only the saved login gets it there.
  - name: A signed-in user changes their name, starting from the saved login
    uses: agent
    with:
      targets:
        browser:
          url: "{{vars.url}}/account"
          storage_state: "{{outputs.login.state}}"
      task: |
        On your account page, change your display name to Dave Renamed, and
        save it.
      expect: |
        The page says the name is saved, and shows the account signed in as
        Dave Renamed.
    timeout: 5m
    test: |
      res.verdict == "pass" && res.url endsWith "/account"
      && len(filter(res.steps, .url contains "/signup")) == 0
  - name: The name changed, as the pages said
    uses: http
    with:
      url: "{{vars.url}}"
      get: "/api/users?email=dave%2B{{vars.id}}%40example.com"
    test: res.code == 200 && res.body.exists == true && res.body.name == "Dave Renamed"

# The job API calls the notes API of e2e/server through the http action of
# Probe, with the key the workflow fixes, and checks each request and its
# response against e2e/api/openapi.yml. Its list of notes gives the count
# as a string, which the document does not allow, for the persona test to
# find without the reviewer.
- name: API
  id: api
  defaults:
    agent:
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
      targets:
        http:
          url: "{{vars.url}}/api/v1"
          openapi: e2e/api/openapi.yml
          headers:
            X-Api-Key: e2e-key
  steps:
  - name: Wait for the server
    uses: http
    with:
      url: "{{vars.url}}"
      get: /health
    retry: {max_attempts: 30, interval: 1s}
    test: res.code == 200
  - name: A client writes a note and reads it back
    id: write
    uses: agent
    with:
      task: |
        Write a note that says "Pay rent {{vars.id}}" through the API, and
        read that note back by its id.
      expect: |
        The note read back by its id says "Pay rent {{vars.id}}".
    timeout: 5m
    test: |
      res.verdict == "pass" && len(filter(res.steps, .target == "http")) >= 2
      && res.targets[0].kind == "http" && res.targets[0].status == 200
  - name: A developer who lists the notes finds the count is not a number
    uses: agent
    with:
      persona: |
        Erin, a developer who writes a client of this API from its OpenAPI
        document, and checks what each endpoint returns.
      goal: |
        Write a note that says "Call Erin {{vars.id}}", and list the notes
        to see how many there are.
    timeout: 5m
    test: |
      res.mode == "persona"
      && len(filter(res.findings, .verified && .title contains "breaks the OpenAPI document")) > 0

# The job gRPC calls notes.v1.Notes of e2e/server through the grpc action of
# Probe, which lists its services and methods by its reflection, with the
# key the workflow fixes in the metadata. The persona test checks each call
# against e2e/api/notes.proto, which declares the count of ListNotes an
# int32 where the server gives a string, for it to find without the
# reviewer. Listing needs Probe v1.38.0 or later.
- name: gRPC
  id: grpc
  defaults:
    agent:
      evidence_dir: out/agent
      provider: "{{vars.provider}}"
      model: "{{vars.model}}"
      timeout: 4m
  steps:
  - name: Wait for the gRPC server
    uses: grpc
    with:
      addr: "{{vars.grpc_addr}}"
      list: true
    retry: {max_attempts: 30, interval: 1s}
    test: '"notes.v1.Notes" in res.services'
  - name: A client writes a note and reads it back over gRPC
    uses: agent
    with:
      task: |
        Write a note that says "Water plants {{vars.id}}" through the gRPC
        API, and read that note back by its id.
      expect: |
        The note read back by its id says "Water plants {{vars.id}}".
      targets:
        grpc:
          addr: "{{vars.grpc_addr}}"
          metadata:
            x-api-key: e2e-key
    timeout: 5m
    test: |
      res.verdict == "pass" && len(filter(res.steps, .target == "grpc")) >= 2
      && res.targets[0].kind == "grpc" && res.targets[0].code == "OK"
  - name: A developer who lists the notes over gRPC finds the count breaks notes.proto
    uses: agent
    with:
      persona: |
        Frank, a developer who writes a client of this gRPC API from its
        .proto files, and checks what each method returns.
      goal: |
        Write a note that says "Call Frank {{vars.id}}", and list the notes
        to see how many there are.
      targets:
        grpc:
          addr: "{{vars.grpc_addr}}"
          metadata:
            x-api-key: e2e-key
          proto:
            files: [e2e/api/notes.proto]
            import_paths: [e2e/api]
    timeout: 5m
    test: |
      res.mode == "persona"
      && len(filter(res.findings, .verified && .title contains "breaks the .proto files")) > 0

# The notes the tests left: the critical one of the sign-up the server
# fails, and those of the findings of Carol. The tests that passed left
# none. On a pull request, CI puts them in a comment of it with
# probe-github-notes, which needs GITHUB_TOKEN; without one, as run by hand,
# the step is skipped.
- name: Notes
  needs: [signup, persona, signed-in, api, grpc]
  always: true
  steps:
  - name: The notes of the tests that did not pass
    uses: hello
    with:
      name: "{{ len(notes) }} notes"
    test: |
      len(filter(notes, .job_id == "signup" && .level == "critical")) == 1
      && len(filter(notes, .job_id == "persona" && .level == "critical")) > 0
      && len(filter(notes, .job_id == "signed-in")) == 0
      && len(filter(notes, .job_id == "api")) > 0
      && len(filter(notes, .job_id == "grpc")) > 0

  - name: Put the notes on the pull request
    uses: github-notes
    skipif: vars.github_token == ""
    with:
      to: comment
      key: e2e
      token: "{{vars.github_token}}"
      notes: "{{ notes }}"
      body: "The notes probe-agent left in e2e/workflow.yml. e2e/server fails a sign-up, answers the page of a new note with a 500, and gives the count of the notes API, and of its gRPC service, as a string, on purpose, so the notes on them are expected."
    test: res.code < 300
