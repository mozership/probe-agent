# probe-agent built from this checkout, for the e2e workflows. Probe
# resolves an action before the first job starts, so the executable is
# built before probe runs:
#
#   go build -o e2e/action/probe-agent . && probe e2e/workflow.yml
name: agent
description: Test a web application from a task, or a persona and a goal, written in words, with a model that uses it through a browser
params: [task, expect, persona, goal, url, allow_hosts, secrets, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, headless, window_w, window_h, evidence_dir]
runs:
  using: binary
  path: probe-agent
