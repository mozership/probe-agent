# probe-agent built from this checkout, for the e2e workflows. Probe
# resolves an action before the first job starts, so the executable is
# built before probe runs:
#
#   go build -o e2e/action/probe-agent . && probe e2e/workflow.yml
name: agent
description: Test an application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser, an iOS app, or both
params: [task, expect, persona, goal, targets, secrets, cache, cache_mode, cache_judge, provider, model, effort, base_url, vision, max_steps, timeout, language, evidence_dir, job_summary]
choices:
  cache_mode: [auto, read, refresh, strict]
  cache_judge: [checks, always]
  effort: [low, medium, high, xhigh, max]
  provider: {values: [anthropic, gemini, openai, sakura, xai], ignore_case: true}
runs:
  using: binary
  path: probe-agent
