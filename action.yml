    linux_amd64: "774376b626626c43ad55dbc1941065447897c372ea90fc29a165d2e814db06ce"
    linux_arm64: "2b40112ba2fc356f53bd6ee451afd6cb78ec0260d17f0c9667f2d998f9bf70be"
