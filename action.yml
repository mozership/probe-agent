# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test a web application from a task, or a persona and a goal, written in words, with a model that uses it through a browser
params: [task, expect, persona, goal, url, allow_hosts, secrets, model, effort, max_steps, timeout, headless, window_w, window_h, evidence_dir]
runs:
  using: binary
  # probe manifest <tag> <checksums-file> puts the tag of a release here and
  # the digests of its executables in checksums. The release must publish
  # the executable of each platform under this name.
  url: https://github.com/mozership/probe-agent/releases/download/v0.0.0/probe-agent_{os}_{arch}
