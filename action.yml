# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test an application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser, an iOS or Android app, an HTTP, gRPC or GraphQL API, a mailbox, a database, or more than one of them
params: [task, expect, persona, goal, targets, secrets, cache, cache_mode, cache_judge, provider, model, effort, base_url, vision, max_steps, timeout, language, evidence_dir, job_summary]
choices:
  cache_judge: [checks, always]
  cache_mode: [auto, read, refresh, strict]
  effort: [low, medium, high, xhigh, max]
  provider: {values: [anthropic, gemini, openai, sakura, xai], ignore_case: true}
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.14.2/probe-agent_{os}_{arch}
  checksums:
    darwin_amd64: "72289156b975da12288868cd5fd079dc290ff808713aa6b142707526d096b8ef"
    darwin_arm64: "ba5cbd69c53cca4f83af3c68a5aafefa8e2974c61d8434c0f0304e1468939ccc"
    linux_amd64: "80660146e23304d7b15058e40e4ec37c9286e37dfcf766617a3501d9062f5e7f"
    linux_arm64: "350b6d53cc9652c533a27a53b0af7912ed39caafc070e18f3782343503052050"
