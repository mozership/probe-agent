    linux_amd64: "e5357d07d080ab5c7e28f39cd2e6c0e3758f1680def7062bbd299dd064dbd00a"
    linux_arm64: "f203ba59a071f53d44023f671638a8b23dc8bc9a506a3c3529cb691612e80372"
