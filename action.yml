# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test a web application from a task, or a persona and a goal, written in words, with a model that uses it through a browser
params: [task, expect, persona, goal, url, allow_hosts, secrets, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, headless, window_w, window_h, evidence_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.2.0/probe-agent_{os}_{arch}
  checksums:
    darwin_amd64: "ebc8ab34770ae252b1fbfb914d47224708539ce0e3c3b911bce1376f2b7ca8fa"
    darwin_arm64: "24099e198063995f73c2ca2f997cdcf1c19b97e013163c6df78524144be2cca3"
    linux_amd64: "849a2bc27a6253e619308b6d949dfc4a89acaf3a5aa806b52cfd921e52a8fc99"
    linux_arm64: "2b480bd0aaabcfdd6d5b0c31b89824f31e61d1c6753c15e135ea3486febe3086"
