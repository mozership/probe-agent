# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test an application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser, an iOS or Android app, an HTTP API, a gRPC API, or more than one of them
params: [task, expect, persona, goal, targets, secrets, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, evidence_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.8.0/probe-agent_{os}_{arch}
