# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test a web application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser
params: [task, expect, persona, goal, url, allow_hosts, secrets, storage_state, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, headless, window_w, window_h, evidence_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.4.0/probe-agent_{os}_{arch}
  checksums:
    darwin_amd64: "401864d4b50d62848087509b202783366168afe46e3d20bbdddc7f6e56bb0e8e"
    darwin_arm64: "c5c8f6d34e96b1572237b515d50fde75d27da666e9873b636b2bb37f59b5a4e2"
    linux_amd64: "3911634f0526c3a6dc9126d596de071d03effd8f112fb58cc1c32e340b958265"
    linux_arm64: "d477aefb067e6feee1d0142b3070e8b7039416d0155928c8b2e77dc3025e4625"
