# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test an application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser, an iOS app, an HTTP API, or more than one of them
params: [task, expect, persona, goal, targets, url, allow_hosts, secrets, storage_state, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, headless, window_w, window_h, evidence_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.6.0/probe-agent_{os}_{arch}
  checksums:
    darwin_amd64: "5c682b53d5dd20423c7f5adccb705403bd64bb6ce61c6d273c8d1316f1efb8af"
    darwin_arm64: "408c991aa3e55c5a98b5cd0c1434e9d4da495ed90373c19efc6d434a6127e493"
    linux_amd64: "714a6aee35dea1f1fe3573ef6d24288daa1b16f4bbc83ec07acfed731ddd5882"
    linux_arm64: "fef56ee6881723b5623527e267eb5aa881fdb3b1db5635272db6fe1c4227b4fe"
