# It declares no guard: the action cannot tell what a page will do, nor
# what the model will click, so a step that uses it is refused under
# --read-only or --allow-host unless --allow-action names it.
name: agent
description: Test an application from a task, or a persona and a goal, written in natural language, with a model that uses it through a browser, an iOS or Android app, an HTTP, gRPC or GraphQL API, a mailbox, or more than one of them
params: [task, expect, persona, goal, targets, secrets, cache, cache_mode, provider, model, effort, base_url, vision, max_steps, timeout, evidence_dir]
runs:
  using: binary
  url: https://github.com/mozership/probe-agent/releases/download/v0.9.0/probe-agent_{os}_{arch}
  checksums:
    darwin_amd64: "e7bba07ec513671c73f6bd011cfd3ac910d8b74128b0ef946632b8a2d43c2867"
    darwin_arm64: "ce9af2396f5a5873c66d469a3f99e78c65b1c2d63c648761344735590371816a"
    linux_amd64: "6feed73ac2cb393c272d16eeb90c17eee01a641e4b5a1d7321e790bf40ece649"
    linux_arm64: "e3e18d8117267de8c08a6514bfdd06a9d006f6882b77e6e60f1e115fc9246314"
